<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090f20" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes signalPulse {
      0% { r: 15px; opacity: 0.9; }
      50% { opacity: 0.5; }
      100% { r: 95px; opacity: 0; }
    }
    @keyframes signalPulse2 {
      0% { r: 10px; opacity: 0.8; }
      50% { opacity: 0.4; }
      100% { r: 70px; opacity: 0; }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillLag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .radar-arm {
      transform-origin: 1060px 180px;
      animation: radarSpin 8s linear infinite;
    }
    .wave-pulse-1 {
      animation: signalPulse 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .wave-pulse-2 {
      animation: signalPulse 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.5s;
    }
    .carrier-wave {
      stroke-dasharray: 8 6;
      animation: waveFlow 12s linear infinite;
    }
    .pill-floating {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-floating-lag {
      animation: floatPillLag 6s ease-in-out infinite 1s;
    }
    .node-spark-1 { animation: nodeBlink 2.4s ease-in-out infinite 0.2s; }
    .node-spark-2 { animation: nodeBlink 3.1s ease-in-out infinite 0.8s; }
    .node-spark-3 { animation: nodeBlink 2.8s ease-in-out infinite 1.4s; }
    ]]>
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g stroke="#1a274c" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="650" y1="0" x2="650" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Ambient Dynamic Radio Frequency Sine Waves across Background -->
  <path d="M 0,220 Q 200,160 400,220 T 800,220 T 1200,220" fill="none" stroke="#00f2fe" stroke-width="2.2" opacity="0.2" class="carrier-wave" />
  <path d="M 0,250 Q 250,310 500,250 T 1000,250 T 1200,250" fill="none" stroke="#7928ca" stroke-width="1.8" opacity="0.25" class="carrier-wave" />

  <!-- Right Decorative Live Radar / RF Auditing Scanner -->
  <g id="radarGroup">
    <!-- Static concentric rings -->
    <circle cx="1060" cy="180" r="130" fill="none" stroke="#16274e" stroke-width="1.5" />
    <circle cx="1060" cy="180" r="95" fill="none" stroke="#1c356b" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="1060" cy="180" r="60" fill="none" stroke="#224488" stroke-width="1.2" />
    <circle cx="1060" cy="180" r="25" fill="none" stroke="#2d5bb8" stroke-width="1" />

    <!-- Expanding animated pulse ripples -->
    <circle cx="1060" cy="180" r="20" fill="none" stroke="#00f2fe" stroke-width="2" class="wave-pulse-1" />
    <circle cx="1060" cy="180" r="20" fill="none" stroke="#4facfe" stroke-width="1.5" class="wave-pulse-2" />

    <!-- Radar Crosshairs -->
    <line x1="930" y1="180" x2="1190" y2="180" stroke="#1f376d" stroke-width="1" />
    <line x1="1060" y1="50" x2="1060" y2="310" stroke="#1f376d" stroke-width="1" />

    <!-- Rotating Radar Scanner Beam -->
    <g class="radar-arm">
      <path d="M 1060 180 L 1180 130 A 130 130 0 0 0 1060 50 Z" fill="url(#radarSweepGrad)" />
      <line x1="1060" y1="180" x2="1180" y2="130" stroke="#00f2fe" stroke-width="2" filter="url(#softGlow)" />
    </g>

    <!-- Radar Detected AP and Packet Blips -->
    <circle cx="1030" cy="120" r="3.5" fill="#00f2fe" class="node-spark-1" filter="url(#softGlow)" />
    <text x="1038" y="118" fill="#00f2fe" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="9" opacity="0.75">AP_01 [WPA3]</text>

    <circle cx="1115" cy="225" r="3" fill="#ff0080" class="node-spark-2" filter="url(#softGlow)" />
    <text x="1122" y="228" fill="#ff0080" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="9" opacity="0.75">ROGUE_DEAUTH</text>

    <circle cx="990" cy="230" r="2.5" fill="#38bdf8" class="node-spark-3" />
    <circle cx="1060" cy="180" r="4.5" fill="#00f2fe" filter="url(#softGlow)" />
  </g>

  <!-- Left Dynamic Tech Signal Accent -->
  <g opacity="0.7">
    <circle cx="65" cy="80" r="4" fill="#00f2fe" class="node-spark-1" />
    <line x1="65" y1="80" x2="140" y2="80" stroke="#1f376d" stroke-width="1" />
    <line x1="140" y1="80" x2="170" y2="50" stroke="#00f2fe" stroke-width="1.2" />
    <text x="180" y="54" fill="#00f2fe" font-family="'Segoe UI', monospace" font-size="10" letter-spacing="1.5">IEEE 802.11ax / WPA3 / BLE 5.4</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title and Badges in clear foreground -->
  <g transform="translate(70, 0)">
    <!-- Top Category Tag -->
    <rect x="0" y="90" width="220" height="26" rx="13" fill="#0c1b3d" stroke="#00f2fe" stroke-width="1" />
    <circle cx="14" cy="103" r="4" fill="#00f2fe" class="node-spark-1" />
    <text x="26" y="107" fill="#38bdf8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SECURITY &amp; AUDITING</text>

    <!-- Main Title -->
    <text x="0" y="165" fill="#ffffff" font-family="'Segoe UI', -apple-system, 'SF Pro Display', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">
      Awesome Wireless Auditing
    </text>
    <text x="0" y="215" fill="url(#neonCyan)" font-family="'Segoe UI', -apple-system, 'SF Pro Display', Roboto, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5" filter="url(#softGlow)">
      &amp; Network Security
    </text>

    <!-- Subtitle -->
    <text x="0" y="260" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated Directory of Enterprise SaaS Solutions, RF Spectrum Analyzers &amp; Open-Source Wi-Fi Exploits
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 290)">
      <!-- Pill 1: 802.11 Auditing -->
      <g class="pill-floating">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e3a70" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#00f2fe" />
        <text x="28" y="22" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📡 Wi-Fi 6E/7 Auditing</text>
      </g>

      <!-- Pill 2: RF and SDR -->
      <g transform="translate(180, 0)" class="pill-floating-lag">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e3a70" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#a855f7" />
        <text x="28" y="22" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📻 RF Spectrum / SDR</text>
      </g>

      <!-- Pill 3: WPA3 and Handshakes -->
      <g transform="translate(355, 0)" class="pill-floating">
        <rect x="0" y="0" width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e3a70" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#ff0080" />
        <text x="28" y="22" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔐 WPA3 / PMKID Crack</text>
      </g>

      <!-- Pill 4: WIDS / WIPS -->
      <g transform="translate(555, 0)" class="pill-floating-lag">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="url(#cardGrad)" stroke="#1e3a70" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#10b981" />
        <text x="28" y="22" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Rogue AP &amp; WIDS</text>
      </g>
    </g>
  </g>
</svg>
